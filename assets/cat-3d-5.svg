<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="bedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A33"/>
      <stop offset="100%" stop-color="#F75C02"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8A33"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0DD"/>
      <stop offset="100%" stop-color="#FFE0BB"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="250" cy="410" rx="180" ry="30" fill="rgba(0,0,0,0.08)"/>
  <!-- Bed base (bowl shape) -->
  <path d="M60 300 Q60 400 250 400 Q440 400 440 300 L440 280 Q440 340 250 360 Q60 340 60 280 Z" fill="url(#bedGrad)"/>
  <!-- Bed rim -->
  <ellipse cx="250" cy="280" rx="190" ry="70" fill="url(#cushionGrad)"/>
  <!-- Inner cushion -->
  <ellipse cx="250" cy="280" rx="150" ry="50" fill="url(#innerGrad)"/>
  <!-- Paw print on cushion -->
  <g transform="translate(250,275)" fill="#F75C02" opacity="0.6">
    <!-- Main pad -->
    <ellipse cx="0" cy="8" rx="22" ry="18"/>
    <!-- Toe pads -->
    <circle cx="-18" cy="-12" r="9"/>
    <circle cx="-5" cy="-20" r="9"/>
    <circle cx="10" cy="-20" r="9"/>
    <circle cx="22" cy="-12" r="9"/>
  </g>
  <!-- Rim highlight -->
  <path d="M100 260 Q250 230 400 260" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
